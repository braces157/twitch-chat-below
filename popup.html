<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch Chat Below</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="icons/icon-128.png" width="44" height="44" alt="">
    <div><h1>Twitch Chat Below</h1><p>More room for your stream.</p></div>
  </header>
  <main>
    <section class="setting" aria-label="Layout">
      <label class="toggle" for="enabled">
        <span><strong>Chat below the stream</strong><small>Keep your video full width</small></span>
        <input id="enabled" type="checkbox" role="switch" disabled>
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </section>
    <section class="setting height-setting" aria-label="Chat height">
      <label for="height">Chat height <output id="height-value" for="height">420 px</output></label>
      <input id="height" type="range" min="260" max="900" step="20" value="420" disabled>
      <div class="range-labels" aria-hidden="true"><span>Compact</span><span>Spacious</span></div>
    </section>
    <p class="hint">Changes apply to open Twitch channel pages. Switch off to restore the original layout.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer><span>Made for Twitch</span><span>v1.1.0</span></footer>
  <script src="popup.js"></script>
</body>
</html>
